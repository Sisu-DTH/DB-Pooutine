name: Promotions Manager MVP Tests

on:
  pull_request:
    paths:
      - 'promotions-manager/**'
      - '.github/workflows/promotions-manager-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manager and test dependencies
        run: python -m pip install -r promotions-manager/requirements.txt
      - name: Compile backend module
        run: python -m py_compile promotions-manager/main.py
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("promotions-manager/dashboard.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          if not match:
              raise SystemExit("Dashboard script missing")
          Path("/tmp/sdth_manager_dashboard.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/sdth_manager_dashboard.js
      - name: Run FastAPI integration tests
        working-directory: promotions-manager
        run: pytest -q test_main.py
